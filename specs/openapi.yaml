components:
  schemas:
    ApprovalIn:
      properties:
        plan_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Plan Hash
        incident_status:
          type: string
          pattern: ^recovery_proposed$
          title: Incident Status
        reason_code:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          title: Reason Code
          default: approved_by_operator
        note:
          anyOf:
          - type: string
            maxLength: 500
            minLength: 1
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - plan_hash
      - incident_status
      title: ApprovalIn
    BusinessEventIn:
      properties:
        idempotency_key:
          type: string
          maxLength: 255
          minLength: 1
          title: Idempotency Key
        correlation_id:
          type: string
          maxLength: 255
          minLength: 1
          title: Correlation Id
        entity_type:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{0,63}$
          title: Entity Type
        entity_id:
          type: string
          maxLength: 255
          minLength: 1
          title: Entity Id
        event_type:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{0,127}$
          title: Event Type
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        source:
          $ref: '#/components/schemas/SourceIn'
        payload:
          additionalProperties: true
          type: object
          maxProperties: 64
          title: Payload
      additionalProperties: false
      type: object
      required:
      - idempotency_key
      - correlation_id
      - entity_type
      - entity_id
      - event_type
      - occurred_at
      - source
      title: BusinessEventIn
    ChaosModeIn:
      properties:
        mode:
          type: string
          pattern: ^(normal|false_200|timeout|delayed_write|amount_mismatch|partial_success)$
          title: Mode
        correlation_id:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Correlation Id
      type: object
      required:
      - mode
      title: ChaosModeIn
    CredentialIssueIn:
      properties:
        scopes:
          items:
            type: string
          type: array
          maxItems: 9
          minItems: 1
          uniqueItems: true
          title: Scopes
        expires_in_seconds:
          anyOf:
          - type: integer
            maximum: 2592000.0
            minimum: 1.0
          - type: 'null'
          title: Expires In Seconds
        label:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Label
      additionalProperties: false
      type: object
      required:
      - scopes
      title: CredentialIssueIn
    CredentialRotateIn:
      properties:
        expires_in_seconds:
          anyOf:
          - type: integer
            maximum: 2592000.0
            minimum: 1.0
          - type: 'null'
          title: Expires In Seconds
      additionalProperties: false
      type: object
      title: CredentialRotateIn
    EventReceipt:
      properties:
        id:
          type: string
          title: Id
