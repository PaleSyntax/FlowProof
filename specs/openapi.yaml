          items:
            type: string
          type: array
          maxItems: 9
          minItems: 1
          uniqueItems: true
          title: Scopes
      additionalProperties: false
      type: object
      required:
      - name
      - scopes
      title: ServiceAccountIn
    SourceIn:
      properties:
        system:
          type: string
          maxLength: 64
          minLength: 1
          title: System
        workflow_id:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Workflow Id
        workflow_version:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Workflow Version
        execution_id:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Execution Id
        node_name:
          anyOf:
          - type: string
