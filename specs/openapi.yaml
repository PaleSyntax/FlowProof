    XeroQualificationIn:
      properties:
        invoice_id:
          type: string
          maxLength: 255
          minLength: 1
          title: Invoice Id
        expected_exists:
          type: boolean
          title: Expected Exists
          default: true
        expected_amount:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,19}0*$)\d{0,16}\.\d{0,2}0*$)
          title: Expected Amount
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          title: Currency
        provider_identity_confirmed:
          type: boolean
