          type: boolean
          title: Duplicate
        content_hash:
          type: string
          title: Content Hash
      type: object
      required:
      - id
      - duplicate
      - content_hash
      title: EventReceipt
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HumanPrincipalIn:
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        password:
          type: string
          maxLength: 1024
          minLength: 12
          title: Password
