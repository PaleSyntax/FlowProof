      required:
      - invoice_id
      - expected_amount
      - currency
      - provider_identity_confirmed
      - entity_confirmed
      - evidence_bounded
      - no_mutation_confirmed
      title: XeroQualificationIn
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API credential issued to a human or service principal.
    SessionCookie:
      type: apiKey
      in: cookie
      name: flowproof_session
      description: Human browser session; state-changing requests also require X-CSRF-Token.
