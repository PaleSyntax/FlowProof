          title: Plan Hash
      additionalProperties: false
      type: object
      required:
      - plan_hash
      title: ReconcileIn
    RecoveryDecisionIn:
      properties:
        plan_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Plan Hash
        incident_status:
          type: string
          pattern: ^(recovery_proposed|recovery_approved)$
          title: Incident Status
        reason_code:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          title: Reason Code
        note:
          anyOf:
          - type: string
            maxLength: 500
            minLength: 1
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - plan_hash
      - incident_status
      - reason_code
      title: RecoveryDecisionIn
    RoleChangeIn:
