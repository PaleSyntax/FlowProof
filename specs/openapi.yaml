          type: string
          maxLength: 1024
          minLength: 1
          title: Password
      additionalProperties: false
      type: object
      required:
      - name
      - password
      title: LoginIn
    OperatorReviewIn:
      properties:
        plan_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Plan Hash
        capsule_digest:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Capsule Digest
        evidence_understood:
          type: boolean
          title: Evidence Understood
        authoritative_source_understood:
          type: boolean
          title: Authoritative Source Understood
        blast_radius_understood:
          type: boolean
