          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    XeroPkceStartIn:
      properties:
        client_id:
          type: string
          maxLength: 128
