        proposed_action_understood:
          type: boolean
          title: Proposed Action Understood
        reject_path_available:
          type: boolean
          title: Reject Path Available
        revoke_path_available:
          type: boolean
          title: Revoke Path Available
        reconciliation_path_understood:
          type: boolean
          title: Reconciliation Path Understood
        final_decision:
          type: string
          pattern: ^(approve|reject|revoke_approval|observe_only)$
          title: Final Decision
        note:
          anyOf:
          - type: string
            maxLength: 500
            minLength: 1
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - plan_hash
      - evidence_understood
      - authoritative_source_understood
      - blast_radius_understood
      - proposed_action_understood
      - reject_path_available
      - revoke_path_available
      - reconciliation_path_understood
      - final_decision
      title: OperatorReviewIn
    PasswordChangeIn:
