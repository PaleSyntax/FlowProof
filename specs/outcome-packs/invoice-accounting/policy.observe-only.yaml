schema_version: "1.0"
name: invoice-accounting-observe-only
version: "0.1.0"
entity_type: invoice

impact:
  amount_event: invoice.validated
  amount_path: $.amount
  currency_path: $.currency

# This pack deliberately has no recovery section and no recovery_action. The
# selected provider adapter may perform authoritative reads only.
invariants:
  - id: approval_before_registration
    type: ordering
    severity: high
    description: Invoice registration must be requested only after approval.
    before: invoice.approved
    after: invoice.registration_requested

  - id: registration_ack_exactly_once
    type: exactly_once
    severity: high
    description: The workflow must acknowledge the provider registration exactly once.
    event: invoice.registration_acknowledged
    after: invoice.registration_requested
    within: 30s

  - id: external_invoice_exists
    type: external_assertion
    severity: critical
    description: The authoritative provider must contain exactly one matching invoice.
    after: invoice.registration_acknowledged
    within: 30s
    verifier: owner_authorized_invoice_provider
    expect:
      exists: true
      unique: true
      fields:
        amount:
          equals_event:
            event: invoice.validated
            path: $.amount
          tolerance: 0.01
        currency:
          equals_event:
            event: invoice.validated
            path: $.currency

  - id: process_completes
    type: eventually
    severity: high
    description: A provider-verified invoice must complete within the business SLA.
    after: invoice.registration_acknowledged
    expect: invoice.verified
    within: 60s

  - id: validated_amount_matches_registered_amount
    type: value_matches
    severity: critical
    description: The independently read amount must match the validated amount.
    left:
      event: invoice.validated
      path: $.amount
    right:
      event: invoice.verified
      path: $.amount
    tolerance: 0.01
