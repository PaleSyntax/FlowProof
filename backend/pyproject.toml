[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flowproof-api"
version = "0.6.0"
description = "Deterministic business outcome assurance for workflow automation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
