name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  application:
    runs-on: ubuntu-24.04
    env:
      FLOWPROOF_API_IMAGE: flowproof-api:ci
      FLOWPROOF_WEB_IMAGE: flowproof-web:ci
      FLOWPROOF_MOCK_IMAGE: flowproof-mock:ci
      FLOWPROOF_SECRETS_DIR: ${{ github.workspace }}/.ci-secrets
      FLOWPROOF_N8N_SECRETS_DIR: ${{ github.workspace }}/.ci-n8n-secrets
      POSTGRES_DB: flowproof
      POSTGRES_USER: flowproof
      FLOWPROOF_CORS_ORIGIN: https://dashboard.example.test
      FLOWPROOF_ACCOUNTING_URL: http://accounting.internal
      FLOWPROOF_N8N_HOST: n8n.example.test
      FLOWPROOF_N8N_EDITOR_BASE_URL: https://n8n.example.test/
      FLOWPROOF_N8N_WEBHOOK_URL: https://n8n.example.test/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Attest PR merge tree matches head tree
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$PR_HEAD_SHA^{tree}")"
          printf 'PR merge-tree %s equals PR head tree %s\n' "$(git rev-parse HEAD)" "$PR_HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock
          python -m pip install -e backend
      - name: Backend tests and migrations
        run: python -m pytest backend/tests --ignore=backend/tests/test_windows_appliance_contracts.py
      - name: Ruff
        run: python -m ruff check backend/src backend/tests
      - name: Version consistency
        run: python scripts/check_version_consistency.py
      - name: Release status contract
        run: python scripts/check_release_status.py
      - name: Parse OpenAPI
        run: python -c "import yaml; yaml.safe_load(open('specs/openapi.yaml', encoding='utf-8')); print('OpenAPI parsed')"
      - name: Validate n8n workflows
        run: python scripts/validate_workflows.py
      - name: ShellCheck and shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          shellcheck --version
          find deploy/scripts security -type f -name '*.sh' -print0 | xargs -0 shellcheck -x
          bash -n deploy/scripts/*.sh
          bash -n security/*.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Compose configuration
        run: |
          mkdir -p "$FLOWPROOF_SECRETS_DIR"
          for secret in token_pepper postgres_password alert_webhook_url; do printf 'ci-only-placeholder\n' > "$FLOWPROOF_SECRETS_DIR/$secret"; chmod 600 "$FLOWPROOF_SECRETS_DIR/$secret"; done
          mkdir -p "$FLOWPROOF_N8N_SECRETS_DIR"
          printf 'ci-only-placeholder\n' > "$FLOWPROOF_N8N_SECRETS_DIR/n8n_encryption_key"
          chmod 600 "$FLOWPROOF_N8N_SECRETS_DIR/n8n_encryption_key"
          docker compose config --quiet
          docker compose -f docker-compose.production.yml config --quiet
          docker compose -f docker-compose.production.yml -f docker-compose.integration-n8n.yml --profile n8n config --quiet
          docker compose -f docker-compose.production.yml -f docker-compose.production-smoke.yml config --quiet
      - name: Build local immutable-image candidates
        run: docker compose -f docker-compose.production.yml -f docker-compose.production-smoke.yml build
      - name: Gitleaks exact range and working tree scan
        id: gitleaks
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          GITLEAKS_IMAGE='zricethezav/gitleaks@sha256:f44e526acc67786b7476db413edb993ce2d152660d32fb3eb48d9bca06fa83f8'
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            SCAN_BASE_SHA="$PR_BASE_SHA"
            SCAN_HEAD_SHA="$PR_HEAD_SHA"
          else
            SCAN_HEAD_SHA="$PUSH_HEAD_SHA"
            SCAN_BASE_SHA="$PUSH_BEFORE_SHA"
            if [[ -z "$SCAN_BASE_SHA" || "$SCAN_BASE_SHA" =~ ^0+$ ]]; then
              SCAN_BASE_SHA="$(git rev-list --max-parents=0 "$SCAN_HEAD_SHA")"
            fi
          fi
          git fetch --no-tags origin "$SCAN_BASE_SHA" "$SCAN_HEAD_SHA"
          test "$(git rev-parse "$SCAN_HEAD_SHA")" = "$SCAN_HEAD_SHA"
          git merge-base --is-ancestor "$SCAN_BASE_SHA" "$SCAN_HEAD_SHA"
          commit_count="$(git rev-list --count "$SCAN_BASE_SHA..$SCAN_HEAD_SHA")"
          echo "Gitleaks base: $SCAN_BASE_SHA"
          echo "Gitleaks head: $SCAN_HEAD_SHA"
          echo "Commits in scan: $commit_count"
          mkdir -p gitleaks-artifacts
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -v "$GITHUB_WORKSPACE/gitleaks-artifacts:/reports" -w /repo "$GITLEAKS_IMAGE" \
            detect --source /repo --log-opts "$SCAN_BASE_SHA..$SCAN_HEAD_SHA" --redact=100 --report-format sarif --report-path /reports/gitleaks-range.sarif
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -v "$GITHUB_WORKSPACE/gitleaks-artifacts:/reports" -w /repo "$GITLEAKS_IMAGE" \
            detect --source /repo --no-git --redact=100 --report-format sarif --report-path /reports/gitleaks-working-tree.sarif
          scanner_version="$(docker run --rm "$GITLEAKS_IMAGE" version | tr -d '\r\n')"
          GITLEAKS_SCANNED_HEAD="$SCAN_HEAD_SHA"
          test "$GITLEAKS_SCANNED_HEAD" = "$SCAN_HEAD_SHA"
          test "$GITLEAKS_SCANNED_HEAD" = "${PR_HEAD_SHA:-$PUSH_HEAD_SHA}"
          export SCAN_BASE_SHA GITLEAKS_SCANNED_HEAD
          export GITLEAKS_COMMIT_COUNT="$commit_count" GITLEAKS_IMAGE GITLEAKS_VERSION="$scanner_version"
          python - <<'PY' > gitleaks-artifacts/gitleaks-range-evidence.json
          import json, os
          print(json.dumps({
              "base_sha": os.environ["SCAN_BASE_SHA"],
              "head_sha": os.environ["GITLEAKS_SCANNED_HEAD"],
              "commit_count": int(os.environ["GITLEAKS_COMMIT_COUNT"]),
              "scanner_image": os.environ["GITLEAKS_IMAGE"],
              "scanner_version": os.environ["GITLEAKS_VERSION"],
              "result": "passed",
          }, sort_keys=True))
          PY
          python scripts/test_gitleaks_exact_range.py | tee gitleaks-artifacts/gitleaks-long-pr-regression.json
          echo "scanned_head=$SCAN_HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload sanitized Gitleaks evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-${{ steps.gitleaks.outputs.scanned_head || github.sha }}
          path: |
            gitleaks-artifacts/gitleaks-range-evidence.json
            gitleaks-artifacts/gitleaks-long-pr-regression.json
            gitleaks-artifacts/gitleaks-range.sarif
            gitleaks-artifacts/gitleaks-working-tree.sarif
          if-no-files-found: warn
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r backend/requirements.lock
      - name: npm dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  windows-appliance-contracts:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock
          python -m pip install -e backend
      - name: Windows appliance contracts
        run: python -m pytest backend/tests/test_windows_appliance_contracts.py
