name: Deployment proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deployment-proof:
    name: Fresh install, upgrade, rollback, restore (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install proof client dependencies
        run: python -m pip install -r backend/requirements.lock
      - name: Assert exact pull-request head checkout
        id: revision
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          printf 'head=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Run Linux production-core deployment proof
        shell: bash
        env:
          FLOWPROOF_SMOKE_AUDIT_ROOT: ${{ runner.temp }}/flowproof-deployment-proof
          FLOWPROOF_TESTED_HEAD_SHA: ${{ steps.revision.outputs.head }}
          FLOWPROOF_TESTED_TREE: ${{ steps.revision.outputs.tree }}
        run: |
          set -Eeuo pipefail
          python scripts/production_deployment_smoke.py 2>&1 | tee deployment-proof.log
      - name: Validate deployment proof result contract
        if: ${{ success() }}
        shell: bash
        env:
          FLOWPROOF_SMOKE_AUDIT_ROOT: ${{ runner.temp }}/flowproof-deployment-proof
          EXPECTED_HEAD_SHA: ${{ steps.revision.outputs.head }}
          EXPECTED_TREE: ${{ steps.revision.outputs.tree }}
        run: |
          set -Eeuo pipefail
          python scripts/validate_deployment_proof_result.py \
            --audit-root "$FLOWPROOF_SMOKE_AUDIT_ROOT" \
            --log deployment-proof.log \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --expected-tree "$EXPECTED_TREE"
      - name: Record exact Gitleaks range evidence for deployment artifact
        if: ${{ success() }}
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          FLOWPROOF_SMOKE_AUDIT_ROOT: ${{ runner.temp }}/flowproof-deployment-proof
        run: |
          set -Eeuo pipefail
          GITLEAKS_IMAGE='zricethezav/gitleaks@sha256:f44e526acc67786b7476db413edb993ce2d152660d32fb3eb48d9bca06fa83f8'
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SCAN_BASE_SHA="$PR_BASE_SHA"
            SCAN_HEAD_SHA="$PR_HEAD_SHA"
          else
            SCAN_BASE_SHA="$PUSH_BEFORE_SHA"
            SCAN_HEAD_SHA="$PUSH_HEAD_SHA"
            if [[ -z "$SCAN_BASE_SHA" || "$SCAN_BASE_SHA" =~ ^0+$ ]]; then
              SCAN_BASE_SHA="$(git rev-list --max-parents=0 "$SCAN_HEAD_SHA")"
            fi
          fi
          git fetch --no-tags origin "$SCAN_BASE_SHA" "$SCAN_HEAD_SHA"
          test "$(git rev-parse "$SCAN_HEAD_SHA")" = "$SCAN_HEAD_SHA"
          git merge-base --is-ancestor "$SCAN_BASE_SHA" "$SCAN_HEAD_SHA"
          commit_count="$(git rev-list --count "$SCAN_BASE_SHA..$SCAN_HEAD_SHA")"
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$GITLEAKS_IMAGE" \
            detect --source /repo --log-opts "$SCAN_BASE_SHA..$SCAN_HEAD_SHA" --redact=100 --no-banner
          scanner_version="$(docker run --rm "$GITLEAKS_IMAGE" version | tr -d '\r\n')"
          test "$SCAN_HEAD_SHA" = "${PR_HEAD_SHA:-$PUSH_HEAD_SHA}"
          result_path="$(find "$FLOWPROOF_SMOKE_AUDIT_ROOT" -name result.json -print -quit)"
          test -n "$result_path"
          proof_dir="$(dirname "$result_path")"
          test -d "$proof_dir"
          export SCAN_BASE_SHA SCAN_HEAD_SHA GITLEAKS_IMAGE GITLEAKS_VERSION="$scanner_version"
          export GITLEAKS_COMMIT_COUNT="$commit_count"
          python - <<'PY' > "$proof_dir/gitleaks-range-evidence.json"
          import json, os
          print(json.dumps({
              "base_sha": os.environ["SCAN_BASE_SHA"],
              "head_sha": os.environ["SCAN_HEAD_SHA"],
              "commit_count": int(os.environ["GITLEAKS_COMMIT_COUNT"]),
              "scanner_image": os.environ["GITLEAKS_IMAGE"],
              "scanner_version": os.environ["GITLEAKS_VERSION"],
              "result": "passed",
          }, sort_keys=True))
          PY
      - name: Scrub deployment proof artifact
        if: ${{ success() }}
        shell: bash
        env:
          FLOWPROOF_SMOKE_AUDIT_ROOT: ${{ runner.temp }}/flowproof-deployment-proof
        run: |
          set -Eeuo pipefail
          result_path="$(find "$FLOWPROOF_SMOKE_AUDIT_ROOT" -name result.json -print -quit)"
          test -n "$result_path"
          proof_dir="$(dirname "$result_path")"
          python scripts/scrub_deployment_artifact.py \
            deployment-proof.log \
            "$proof_dir/result.json" \
            "$proof_dir/n8n-credential-replacement.json" \
            "$proof_dir/credential-crash-recovery-evidence.json" \
            "$proof_dir/credential-lifetime-evidence.json" \
            "$proof_dir/gitleaks-range-evidence.json"
      - name: Upload sanitized proof result
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-proof-${{ steps.revision.outputs.head || github.sha }}
          path: |
            deployment-proof.log
            ${{ runner.temp }}/flowproof-deployment-proof/**/result.json
            ${{ runner.temp }}/flowproof-deployment-proof/**/n8n-credential-replacement.json
            ${{ runner.temp }}/flowproof-deployment-proof/**/credential-crash-recovery-evidence.json
            ${{ runner.temp }}/flowproof-deployment-proof/**/credential-lifetime-evidence.json
            ${{ runner.temp }}/flowproof-deployment-proof/**/gitleaks-range-evidence.json
          if-no-files-found: error
      - name: Upload redacted failed command
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-proof-failure-${{ steps.revision.outputs.head || github.sha }}
          path: |
            deployment-proof.log
            ${{ runner.temp }}/flowproof-deployment-proof/**/failed-command.json
          if-no-files-found: warn
