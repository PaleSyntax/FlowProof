schema_version: "1.0"
name: invoice-processing
version: "1.0.0"
entity_type: invoice

impact:
  amount_event: invoice.validated
  amount_path: $.amount
  currency_path: $.currency

invariants:
  - id: approval_before_registration
    type: ordering
    severity: high
    description: Invoice registration must be requested only after approval.
    before: invoice.approved
    after: invoice.registration_requested

  - id: registration_ack_exactly_once
    type: exactly_once
    severity: high
    description: Accounting registration acknowledgement must occur exactly once.
    event: invoice.registration_acknowledged
    after: invoice.registration_requested
    within: 30s

  - id: external_invoice_exists
    type: external_assertion
    severity: critical
    description: The authoritative accounting system must contain exactly one invoice after acknowledging registration.
    after: invoice.registration_acknowledged
    within: 30s
    verifier: mock_accounting_invoice
    expect:
      exists: true
      unique: true
      fields:
        amount:
          equals_event:
            event: invoice.validated
            path: $.amount
          tolerance: 0.01
        currency:
          equals_event:
            event: invoice.validated
            path: $.currency
    recovery_action: register_missing_invoice

  - id: process_completes
    type: eventually
    severity: high
    description: A verified invoice must complete within the business SLA.
    after: invoice.registration_acknowledged
    expect: invoice.verified
    within: 60s

  - id: validated_amount_matches_registered_amount
    type: value_matches
    severity: critical
    description: Registered amount must match the validated invoice amount.
    left:
      event: invoice.validated
      path: $.amount
    right:
      event: invoice.verified
      path: $.amount
    tolerance: 0.01
